server {
    listen 192.168.19.239:18081;
    listen 127.0.0.1:18081;
    server_name _;
    allow 192.168.18.0/23;
    allow 127.0.0.1;
    deny all;
    root /opt/data-center/apps/knowledge/current/frontend;
    index index.html;
    client_max_body_size 100m;
    access_log /var/log/nginx/knowledge-access.log;
    error_log /var/log/nginx/knowledge-error.log;
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
