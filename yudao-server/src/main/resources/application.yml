server:
  port: ${SERVER_PORT:48080}

spring:
  application:
    name: yudao-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yudao_ai}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:yudao}}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations:
        - classpath:sql/mysql/system-base-20260509.sql
        - classpath:sql/mysql/ai-module.sql
        - classpath:sql/mysql/ai-module-upgrade-20260522-fastgpt-citation-source.sql
        - classpath:sql/mysql/ai-module-upgrade-20260528-chatgpt-meeting-actions.sql
        - classpath:sql/mysql/ai-module-upgrade-20260603-teams-meeting-sync.sql
        - classpath:sql/mysql/system-menu-pages-20260509.sql
        - classpath:sql/mysql/ai-module-upgrade-20260604-finance-invoice.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    cn.iocoder.yudao: info

ai:
  model:
    provider: ${AI_MODEL_PROVIDER:mock}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
  vector-store:
    type: ${AI_VECTOR_STORE_TYPE:mock}
    pgvector:
      jdbc-url: ${AI_PGVECTOR_JDBC_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:yudao_ai}}
      username: ${AI_PGVECTOR_USERNAME:${POSTGRES_USER:postgres}}
      password: ${AI_PGVECTOR_PASSWORD:${POSTGRES_PASSWORD:}}
      table-name: ${AI_PGVECTOR_TABLE_NAME:ai_vector_store}
      dimensions: ${AI_PGVECTOR_DIMENSIONS:1536}
  invoice:
    max-file-size-mb: ${AI_INVOICE_MAX_FILE_SIZE_MB:20}
    process-definition-key: ${AI_INVOICE_PROCESS_DEFINITION_KEY:finance_invoice_approval}
    mock-approval-enabled: ${AI_INVOICE_MOCK_APPROVAL_ENABLED:true}
  rag:
    engine: ${AI_RAG_ENGINE:fastgpt}
    default-top-k: ${AI_RAG_DEFAULT_TOP_K:5}
    default-score-threshold: ${AI_RAG_DEFAULT_SCORE_THRESHOLD:0.1}
    max-context-tokens: ${AI_RAG_MAX_CONTEXT_TOKENS:6000}
  fastgpt:
    base-url: ${FASTGPT_BASE_URL:}
    api-key: ${FASTGPT_API_KEY:}
    app-id: ${FASTGPT_APP_ID:}
    model: ${FASTGPT_MODEL:fastgpt}
    connect-timeout-seconds: ${FASTGPT_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${FASTGPT_READ_TIMEOUT_SECONDS:120}
  chatgpt:
    actions:
      enabled: ${CHATGPT_ACTIONS_ENABLED:true}
      token: ${CHATGPT_ACTION_TOKEN:}
      max-transcript-chars: ${CHATGPT_ACTION_MAX_TRANSCRIPT_CHARS:20000}
      default-top-k: ${CHATGPT_ACTION_DEFAULT_TOP_K:5}
      enable-sensitive-mask: ${CHATGPT_ACTION_ENABLE_SENSITIVE_MASK:true}
  teams:
    meeting:
      enabled: ${TEAMS_MEETING_SYNC_ENABLED:false}
      graph-base-url: ${TEAMS_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
      login-base-url: ${TEAMS_LOGIN_BASE_URL:https://login.microsoftonline.com}
      tenant-id: ${MICROSOFT_TENANT_ID:}
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
      default-organizer-user-id: ${TEAMS_MEETING_DEFAULT_ORGANIZER_USER_ID:}
      default-knowledge-base-id: ${TEAMS_MEETING_DEFAULT_KNOWLEDGE_BASE_ID:}
      default-chatgpt-visible: ${TEAMS_MEETING_DEFAULT_CHATGPT_VISIBLE:false}
      default-sensitivity-level: ${TEAMS_MEETING_DEFAULT_SENSITIVITY_LEVEL:NORMAL}
      sync-top: ${TEAMS_MEETING_SYNC_TOP:50}
      transcript-max-chars: ${TEAMS_MEETING_TRANSCRIPT_MAX_CHARS:200000}
      connect-timeout-seconds: ${TEAMS_MEETING_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${TEAMS_MEETING_READ_TIMEOUT_SECONDS:120}
  document:
    default-chunk-size: ${AI_DOCUMENT_DEFAULT_CHUNK_SIZE:800}
    default-chunk-overlap: ${AI_DOCUMENT_DEFAULT_CHUNK_OVERLAP:100}
    max-file-size-mb: ${AI_DOCUMENT_MAX_FILE_SIZE_MB:50}
    embedding-batch-size: ${AI_DOCUMENT_EMBEDDING_BATCH_SIZE:32}
    embedding-batch-max-retries: ${AI_DOCUMENT_EMBEDDING_BATCH_MAX_RETRIES:2}
    embedding-retry-backoff-millis: ${AI_DOCUMENT_EMBEDDING_RETRY_BACKOFF_MILLIS:1000}
    embedding-max-consecutive-failures: ${AI_DOCUMENT_EMBEDDING_MAX_CONSECUTIVE_FAILURES:3}
    storage-base-path: ${AI_DOCUMENT_STORAGE_BASE_PATH:.data/ai-documents}
    ocr:
      enabled: ${AI_DOCUMENT_OCR_ENABLED:false}
      provider: ${AI_DOCUMENT_OCR_PROVIDER:tesseract-cli}
      tesseract-executable: ${AI_DOCUMENT_OCR_TESSERACT_EXECUTABLE:tesseract}
      tessdata-directory: ${AI_DOCUMENT_OCR_TESSDATA_DIRECTORY:}
      language: ${AI_DOCUMENT_OCR_LANGUAGE:chi_sim+eng}
      dpi: ${AI_DOCUMENT_OCR_DPI:200}
      max-pages: ${AI_DOCUMENT_OCR_MAX_PAGES:20}
      timeout-seconds: ${AI_DOCUMENT_OCR_TIMEOUT_SECONDS:60}
      min-text-length-to-skip-ocr: ${AI_DOCUMENT_OCR_MIN_TEXT_LENGTH_TO_SKIP_OCR:20}

leman:
  auth:
    access-token-expire-seconds: ${LEMAN_ACCESS_TOKEN_EXPIRE_SECONDS:7200}
    refresh-token-expire-seconds: ${LEMAN_REFRESH_TOKEN_EXPIRE_SECONDS:604800}
    bootstrap:
      enabled: ${LEMAN_BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${LEMAN_ADMIN_USERNAME:admin}
      password: ${LEMAN_ADMIN_PASSWORD:}
      tenant-id: ${LEMAN_ADMIN_TENANT_ID:1}
      dept-id: ${LEMAN_ADMIN_DEPT_ID:100}
